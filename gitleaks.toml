title = "IAM Sankey secret scanning configuration"
description = "Extends Gitleaks defaults with Dynatrace-specific token detection."

[extend]
useDefault = true

# Dynatrace token prefixes such as dt0c01 and dt0s01.
# The captured secret must contain a real value after the prefix.
[[rules]]
id = "dynatrace-token"
description = "Dynatrace token"
regex = '''(?i)\b(dt0[a-z][0-9]{2}\.[a-z0-9._~+/=-]{12,})\b'''
secretGroup = 1
keywords = ["dt0c01", "dt0s01", "dt0"]
tags = ["token", "dynatrace"]

# Detect hard-coded values assigned to common Dynatrace credential names.
# References such as token=$token or process.env.DT_TOKEN are intentionally excluded
# because the captured value must be quoted and have high entropy.
[[rules]]
id = "dynatrace-hardcoded-credential"
description = "Potential hard-coded Dynatrace credential"
regex = '''(?i)(?:dt[_-]?token|api[_-]?token|client[_-]?secret|oauth[_-]?secret)\s*[:=]\s*["']([a-z0-9._~+/=-]{16,})["']'''
secretGroup = 1
entropy = 3.0
keywords = ["dt_token", "dt-token", "apitoken", "api_token", "api-token", "clientsecret", "client_secret", "client-secret", "oauth_secret", "oauth-secret"]
tags = ["credential", "dynatrace"]

# Files and generated directories that should not be scanned.
# Source files, workflows, README files, and app.config.json remain in scope.
[[allowlists]]
description = "Generated dependencies, build outputs, and scanner configuration"
paths = [
  '''(^|/)node_modules/''',
  '''(^|/)dist/''',
  '''(^|/)\.dt-app/''',
  '''(^|/)\.claude/''',
  '''(^|/)gitleaks\.toml$''',
  '''(^|/)package-lock\.json$'''
]
